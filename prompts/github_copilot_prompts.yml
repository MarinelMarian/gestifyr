# Below is one way to break down the overall prompt into a series of smaller, more manageable prompts

Webcam Stream and Overlay: >
  Help me write a program in record_samples.py that continuously plays a webcam stream. Add an overlay at the bottom with a play/pause button that toggles using the space bar. When the overlay shows 'Play', set is_paused = True, and when it shows 'Pause', set is_paused = False.

Gesture Cycling with Progress Bar: >
  Extend the program so that when is_paused = False, it cycles through a predefined list of gestures: [nod, shake, mouth_open, eyebrows_raise, long_blink, smile, none]. For each gesture, display its name on screen for 3 seconds (a configurable duration) along with a thin progress bar at the top center showing the elapsed time of those 3 seconds."

Video Recording and Play/Pause Symbols: >
  Modify the program so that while a gesture is displayed, the video segment corresponding to that gesture gets recorded as an mp4 file. Make sure you use cv2.VideoWriter_fourcc(*'mp42'). The filename pattern to use should be: gesture_<gesture index><gesture frames count><timestamp in the format %Y-%m-%d_%H-%M-%S>.mp4. Also instead of the word Play, display '>' and for Pause use '||' symbols. The font scaling for '>' should be 2 while for '||' should be the normal 1.

Playback Mode Initialization: >
  Add a playback mode that toggles when the 'p' key is pressed (setting is_playback = True). In this mode, analyze each gesture video file and generate the CSV files with selected features, using this pattern: <video filename except the extension>.csv. For inspiration on how to do that have a look at parseVideo.py which knows how to process one recorded video file and generates a csv. In record_sample.py, please create a function that does this processing of the video file and the generation of the csv file.

Timeline and Feature Plot Display: >
  After all gesture videos have been processed, maximize the app window. Inside the window display a 100px high timeline that shows as an image, the first frame of each recorded video segment. Next to the timeline (at the bottom), show a plot of all the monitored features. For inspiration on how to do it use the code in analyzeMovement.py. In record_sample.py, please create a function that does this plot parallel and aligned to the timeline of all video files.

More plot display options: >
  The names of the gestures and the frame in the timeline look pixelated. Keep the frame in the timeline resized to 100px height and fill the space between frames (if any) with grey. Also make sure the left margin of every frame aligns with the start of the corresponding plotted data in the timeline. Add very thin grey line delimiters that span over the timeline and the plot, where each delimiter is positioned at the left margin of each frame."

More timeline display options: >
  instead of resizing the composite do a padding with grey background until you fill in the target width

Use of Unicode Symbols: >
  Inspired by the sample below, replace the logic that shows the play/pause text symbols with a logic that displays the play and pause unicode symbols using arial.ttf.

  from PIL import ImageFont, ImageDraw, Image
  import cv2
  import numpy as np

  text_to_show = "The quick brown fox jumps over the lazy dog"

  Load image in OpenCV
  image = cv2.imread("Me.jpg")

  Convert the image to RGB (OpenCV uses BGR)
  cv2_im_rgb = cv2.cvtColor(image,cv2.COLOR_BGR2RGB)

  Pass the image to PIL
  pil_im = Image.fromarray(cv2_im_rgb)

  draw = ImageDraw.Draw(pil_im)

  use a truetype font
  font = ImageFont.truetype("PAPYRUS.ttf", 80)

  Draw the text
  draw.text((10, 700), text_to_show, font=font)

  Get back the image to OpenCV
  cv2_im_processed = cv2.cvtColor(np.array(pil_im), cv2.COLOR_RGB2BGR)

  cv2.imshow('Fonts', cv2_im_processed)
  cv2.waitKey(0)

Identify significant gesture segments and create a detection: >
  Extract the detection of significant feature fluctuations to a separate method called detect_fluctuations_for_feature. After isolating the features of interest, the algorithm should take each 0.5 seconds interval in the gesture and compute a mean over it. Now establish as a baseline the minimum of the absolute value by looking at all the computed means. Now compute the difference against the baseline and figure out what's significant based on the set threshold. Make sure that in the detect_fluctuations_for_feature, if you have multiple detections inside the same gesture, replace them with a single detection that takes the earliest start and the latest end.

Enhance detections to include state change from baseline to significant and back to baseline: >
  In the detect_fluctuations_for_feature, the detection start should actually include the previous analyzed interval. This way we'll capture the state change from baseline to significant change. In the same way, the end of the detection should include the next analyzed interval, so that we capture the state change from significant to baseline.

Save detections: >
  In the show_timeline_and_features (before the plotting begins), for each detection, save the cropped csv and the cropped mp4 video (according to the detection boundaries) in a folders called detections (create the folder if it doesn't exist). Use the same filenames as you used for the gestures.

Gesture Preview Navigation: >
  Enhance playback mode so that the first gesture detection is highlighted with a semi-transparent green tint. When the space bar is pressed, open a separate preview window that displays the video for that particular gesture segment. Allow navigation between gesture segments using the left and right arrow keys.

Gesture Selection for Saving: >
  Allow the user to select a gesture on the timeline for saving: if a gesture is selected, pressing the down arrow should mark it as saved by displaying a small green checkbox on top of that timeline segment.

Saving Selected Gestures: >
  Finally, implement the saving logic: upon pressing 'q', for all the gestures marked for saving, build filenames using the pattern gesture_<index>_<timestamp>. Save the corresponding CSV files to a folder called 'csv_samples' and the associated video segments to a folder called 'video_samples'.

