Overall Prompt: >
  Please help me write a program in record_samples.py, which plays continuously a webcam stream. At the same time I have a collection of head/face gestures mapped to this list [nod, shake, mouth_open, eyebrows_raise, long_blink, smile, none].
  The purpose of the program is: while the webcam stream plays, we show an overlay at the bottom with a play/pause button that toggles by pressing space bar. When play is visible it means the state is_paused = True and when Pause is visible is_paused = False. When in state is_paused = False, we display the name of the current_gesture on screen. We cycle through the list (round and round) showing the current_gesture name for 3 seconds (a configurable amount to give the user a chance to perform the gesture) we also show a thin progress bar at the top center that shows how much time elapsed from the 3 seconds. After that we hide the current_gesture name for 2 seconds (a configurable amount to wait for the next gesture), and then we move on to the next gesture. While we show the current gesture we want to record the video associated with it.
  When we press "p", the webcam stream plays and we enter in playback mode state is_playback = True.
  While in playback mode we want to start by running on all recordings the portion of the parseVideo.py that generates the csv with the selected features. After that we show a 100px high timeline with each video segment on that timeline. Adjacent to the timeline (at the bottom) will have a plot of the features we monitor by running the portion of the analyzeMovement.py that plots a graph. We show with a semi-transparent blue tint, the first gesture portion and if we press "space", we get to see in a separate preview window the video specific to that portion. With arrows left and right we can switch back and forth between gestures on the timeline. While a gesture is selected if we press arrow down we decide to save that gesture in the samples and keep visible a small green checkbox on top of the timeline portion.
  When we press "q" for all the all the gestures selected for save we build a file name pattern of gesture_<index of gesture>_<int gesture timestamp>, then in a folder called csv_samples we save the corresponding gesture csv files, and in a  separate folder called video_samples, we store the video portions corresponding to those same gestures.

